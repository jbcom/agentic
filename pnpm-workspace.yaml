packages:
  - 'packages/*'
  - 'tooling/*'
  - 'docs'

allowBuilds:
  esbuild: true
  nx: true
  sharp: true

# Transitive dependency security overrides. Direct dependencies with
# known CVEs are bumped in their own package.json instead (astro,
# vitest, simple-git, fastify, sharp) — these overrides are for
# packages we don't depend on directly but that vulnerable versions
# get pulled in transitively.
overrides:
  '@ai-sdk/provider-utils': '>=3.0.98'
  '@babel/core': '>=7.29.6'
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4'
  '@hono/node-server': '>=2.0.5'
  '@isaacs/brace-expansion': '>=5.0.7'
  '@playwright/mcp': '>=0.0.40'
  ajv: '>=8.18.0'
  axios: '>=1.18.0'
  body-parser: '>=2.3.0'
  brace-expansion: '>=5.0.7'
  defu: '>=6.1.5'
  devalue: '>=5.8.1'
  esbuild: '>=0.28.1'
  express-rate-limit: '>=8.2.2'
  fast-uri: '>=3.1.4'
  follow-redirects: '>=1.16.0'
  form-data: '>=4.0.6'
  h3: '>=1.15.9'
  handlebars: '>=4.7.9'
  hono: '>=4.12.27'
  ip-address: '>=10.1.1'
  # js-yaml 5.x removed the CJS/ESM default-export interop that
  # @astrojs/internal-helpers (a starlight/astro transitive dep) still
  # relies on ("does not provide an export named 'default'") — pin to the
  # 4.x line, which already contains the CVE fix (GHSA-mcqr-9pcf-4mqm)
  # without the breaking change.
  js-yaml: '>=4.2.0 <5.0.0'
  linkify-it: '>=5.0.2'
  lodash: '>=4.18.0'
  lodash-es: '>=4.18.0'
  markdown-it: '>=14.2.0'
  minimatch: '>=10.2.3'
  morgan: '>=1.11.0'
  path-to-regexp: '>=8.4.0'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.10'
  qs: '>=6.15.2'
  rollup: '>=4.59.0'
  sharp: '>=0.35.0'
  smol-toml: '>=1.6.1'
  svgo: '>=4.0.2'
  tmp: '>=0.2.6'
  undici: '>=7.28.0'
  yaml: '>=2.8.3'

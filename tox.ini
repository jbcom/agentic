[tox]
requires =
    tox-uv>=1.25
    tox-gh>=1.5
env_list =
    py{310,311,312,313,314}
    lint
    docs

[gh]
python =
    3.10 = py310
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314

[testenv]
runner = uv-venv-lock-runner
package = editable
commands =
    uv run --project packages/agentic-crew --extra tests python -m pytest tests {posargs:-v --tb=short}
    uv run --project tooling/pytest-agentic-crew python -m pytest tests {posargs:-v --tb=short}

[testenv:lint]
skip_install = true
commands =
    uv run --project packages/agentic-crew --extra dev python -m ruff check .
    uv run --project packages/agentic-crew --extra dev python -m ruff format --check .
    uv run --project tooling/pytest-agentic-crew --with ruff python -m ruff check .
    uv run --project tooling/pytest-agentic-crew --with ruff python -m ruff format --check .

[testenv:docs]
extras = docs
commands =
    sphinx-build -b markdown docs/sphinx docs/src/content/docs/api/_generated
